<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Information for how to contact Down the River Rafting Co.">
    <meta name="author" content="Scott Smith">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Down the River logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div>
            <h1>Down the River Rafting Co</h1>
            <h2>123 Main River Street</h2>
            <h2>Kolob, California</h2>
            <h2>+1 999 999 9999</h2>
            <h2>info@downtheriver.com</h2>

        </div>
        <div class="contact-grid">
            <aside>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d177613.85704636728!2d-113.30990082866956!3d37.38952807506593!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80ca91afad231a8f%3A0xec6734a36c88eb1f!2sKolob%20Canyons!5e0!3m2!1sen!2sus!4v1770407083028!5m2!1sen!2sus"
                    width="457.5" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </aside>
            <form class="customer-info">
                <div class="form-row">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-row">
                    <label for="useremail">Email Address</label>
                    <input type="email" name="useremail" id="useremail" required>
                </div>

                <fieldset class="purpose">
                    <legend>Message Purpose</legend>
                    <div class="radio-list">
                        <label class="radio-option">
                            <input type="radio" name="purpose" id="purpose-general" value="general" required>
                            <span>General Inquiry</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="purpose" id="purpose-reservation" value="reservation">
                            <span>Reservation Question</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="purpose" id="suggestion" value="love">
                            <span>Website Suggestion</span>
                        </label>
                    </div>
                </fieldset>

                <div class="form-row form-row-message">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>

                <div class="form-row form-row-offset">
                    <span class="form-spacer"></span>
                    <label class="subscribe">
                        <input type="checkbox" name="subscribe" id="subscribe">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <div class="form-row form-row-offset">
                    <span class="form-spacer"></span>
                    <button type="submit">Get in Touch!</button>
                </div>
            </form>
        </div>
        <section class="serve">
            <h2>We Are Here to Serve You</h2>
            <div>
                <figure>
                    <img src="images/happy.jpg">
                    <figcaption>good people</figcaption>
                </figure>
                <figure>
                    <img src="images/happy.jpg">
                    <figcaption>super people</figcaption>
                </figure>
                <figure>
                    <img src="images/happy.jpg">
                    <figcaption>super people</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©️2026 | Down the River Rafting Co. | Scott Smith</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon"></a>
            <a href="https://www.facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon"></a>
            <a href="https://www.youtube.com">
                <img src="images/youtube.svg" alt="Youtube Icon"></a>
        </nav>
    </footer>

</body>

</html>
